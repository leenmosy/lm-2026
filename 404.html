<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Страница не найдена — Mosych Journal</title>
    <meta name="robots" content="noindex" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        background: #fafaf9;
        color: #1c1917;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .code { font-size: 5rem; font-weight: 300; color: #d6d3d1; line-height: 1; }
      .message { margin-top: 1rem; font-size: 1.125rem; color: #78716c; }
      .link {
        display: inline-block;
        margin-top: 2rem;
        font-size: 0.875rem;
        color: #57534e;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .link:hover { color: #1c1917; }
      /* Hide fallback UI once JS redirects */
      .js-hidden { display: none !important; }
    </style>
    <script>
      (function () {
        var path = window.location.pathname || '/';
        // Prevent infinite redirect loop: only redirect once per path
        if (path !== '/' && sessionStorage.getItem('redirect') !== path) {
          sessionStorage.setItem('redirect', path);
          window.location.replace('/');
        } else {
          // JS loaded but we're staying on 404 — hide redirect notice, show fallback UI
          document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('redirecting')?.classList.add('js-hidden');
            document.getElementById('fallback')?.classList.remove('js-hidden');
          });
        }
      })();
    </script>
  </head>
  <body>
    <!-- Shown while JS is redirecting -->
    <div id="redirecting">
      <p class="code">404</p>
      <p class="message">Перенаправляем на главную…</p>
    </div>

    <!-- Fallback: shown if JS loaded but redirect didn't fire (loop guard) -->
    <div id="fallback" class="js-hidden">
      <p class="code">404</p>
      <p class="message">Страница не найдена</p>
      <a class="link" href="/">Вернуться на главную</a>
    </div>

    <!-- No-JS fallback -->
    <noscript>
      <style>#redirecting { display: none !important; } #fallback { display: block !important; }</style>
    </noscript>
  </body>
</html>
